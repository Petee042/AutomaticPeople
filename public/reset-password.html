<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutomaticPeople short term rental - Hosting Asistant</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container reset-password-page" style="max-width: 720px; margin: 48px auto;">
    <header class="reset-password-header">
      <h1>Reset/Enter Password</h1>
      <h2 class="page-title">AutomaticPeople short term rental - Hosting Asistant</h2>
    </header>
    <p id="reset-status" class="message">Enter your new password.</p>

    <form id="resetPasswordForm" novalidate>
      <div class="field">
        <label for="rp-password">New Password <span class="hint">(min 8, 1 uppercase, 1 number, 1 special)</span></label>
        <input type="password" id="rp-password" name="password" autocomplete="new-password" required minlength="8" />
      </div>
      <div class="field">
        <label for="rp-password-confirm">Confirm Password</label>
        <input type="password" id="rp-password-confirm" name="passwordConfirm" autocomplete="new-password" required minlength="8" />
      </div>
      <p id="reset-detail" class="message"></p>
      <button type="submit" class="btn primary">Reset/Enter Password</button>
    </form>

    <div class="reset-password-footer">
      <a href="/index.html" class="btn action-icon action-next" aria-label="Go to logon" title="Go to logon"></a>
    </div>
  </main>

  <script src="/reset-password.js"></script>
<script src="/navigation-guard.js"></script>
</body>
</html>
